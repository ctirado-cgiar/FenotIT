# Tema "Clásico" de FenotIT.
#
# Un tema es un archivo .toml en esta carpeta. Para crear uno nuevo, copia este archivo con
# otro nombre (p. ej. modern.toml), cambia los valores y elígelo en Editar → Preferencias.
# Un tema puede traer solo algunos valores: lo que falte se toma de este archivo.
# Guía completa: docs/design/README.md

[info]
name = "Clásico"
name_en = "Classic"

# ── Colores (#RRGGBB) ────────────────────────────────────────────────────────────
[colors]
# Fondos
bg            = "#F7F7F7"   # ventana principal
bg_panel      = "#ECECEC"   # paneles laterales, barra de estado
bg_card       = "#FFFFFF"   # tarjetas, lienzos, campos de texto, diálogos
bg_topbar     = "#2166AC"   # barra superior
topbar_hover  = "#3A7CC4"   # botón de la barra superior con el mouse encima
topbar_active = "#0D3F75"   # herramienta activa en la barra superior
topbar_pressed = "#1A5490"  # menú de la barra superior presionado
bg_table_sel  = "#D6E8F7"   # fila elegida
bg_chart      = "#FAFAFA"   # área de dibujo de los gráficos
bg_tooltip    = "#FFFFE6"   # texto al pasar el mouse
placeholder   = "#EBEEF2"   # miniatura que aún no carga, pista de la barra de carga

# Texto
text          = "#1A1A1A"   # texto principal
text_muted    = "#666666"   # texto secundario, rótulos
text_faint    = "#999999"   # texto terciario: versión, separadores, notas
text_topbar   = "#FFFFFF"   # texto sobre la barra superior
on_accent     = "#FFFFFF"   # texto e íconos sobre fondos de acento

# Acento
accent         = "#2166AC"  # color principal
accent_dark    = "#1A5490"  # botón presionado, recuadro de zoom
accent_darker  = "#0D3F75"  # manija del rango con foco
accent_faint   = "#7FA6CF"  # ícono de opciones cerrado
accent_light   = "#D6E8F7"  # fondo suave de acento
accent2        = "#006837"  # verde (botones secundarios)
topbar_divider = "#4A8FD4"  # separadores de la barra superior

# Bordes y líneas
border        = "#CCCCCC"
divider       = "#E3E8EE"   # líneas finas que separan secciones
grid          = "#EEEEEE"   # cuadrícula de los gráficos

# Botones
btn_bg        = "#DDEEFF"
btn_hover     = "#B8D4EE"

# Estados
warning       = "#E67E00"
warning_text  = "#B35806"   # avisos escritos
error         = "#C0392B"
success       = "#006837"

# Deslizadores
slider_trough = "#DDDDDD"

# Marcas sobre la foto
white          = "#FFFFFF"  # bordes de regiones, halos, puntos medios
black          = "#000000"  # oscurecido del recorrido guiado, borde del minimapa
highlight      = "#D73027"  # anillo del punto elegido en un gráfico
selection      = "#FFD400"  # vértices de un área elegida
area_include   = "#0B2E59"  # área de análisis
area_exclude   = "#E67E00"  # zona excluida
delete         = "#D32F2F"  # × para borrar un área, con el mouse encima
point_positive = "#2E9E44"  # clic sobre un objeto (MobileSAM)
point_negative = "#D62728"  # clic sobre el fondo (MobileSAM)
scale_line     = "#0078DC"  # línea entre los dos puntos de la escala
scale_point_1  = "#0050DC"
scale_point_2  = "#DCA000"
scale_label    = "#0050A0"

# ── Letras ───────────────────────────────────────────────────────────────────────
# Familias. Con una lista, se usa el primer nombre instalado en el equipo
# (p. ej. sans = ["Inter", "Segoe UI"]).
[families]
sans  = "Segoe UI"
serif = "Georgia"
mono  = "Consolas"

# "familia tamaño [bold|italic]"; familia = sans, serif o mono.
[fonts]
tiny          = "sans 7"
tiny_bold     = "sans 7 bold"
small         = "sans 8"
small_bold    = "sans 8 bold"
small_italic  = "sans 8 italic"
body          = "sans 9"
body_bold     = "sans 9 bold"
large         = "sans 10"
topbar        = "sans 10 bold"
topbar_menu   = "sans 9"    # menús de la barra superior
title         = "sans 11 bold"
subtitle      = "sans 11"
heading       = "sans 12 bold"
heading_large = "sans 13 bold"
logo          = "sans 15 bold"
display       = "sans 22 bold"
display_large = "sans 26 bold"
display_xl    = "sans 28 bold"
motto         = "serif 11 italic"
motto_large   = "serif 12 italic"
motto_xl      = "serif 14 italic"
mono          = "mono 8"

# ── Tamaños (px) ─────────────────────────────────────────────────────────────────
[sizes]
row_height      = 20       # filas de las tablas
button_pad_x    = 8        # margen interior de los botones
button_pad_y    = 3
scroll_arrow    = 12       # flechas de las barras de desplazamiento
progress_thin   = 8        # alto de la barra de avance de la barra de estado
focus_ring      = 1        # borde de foco de casillas y botones (0 = sin borde)

# ── Paletas ──────────────────────────────────────────────────────────────────────
[palettes]
classes    = ["#9E9E9E", "#2166AC", "#2E9E44", "#D62728", "#F2B705", "#8E44AD", "#E67E22", "#17BECF"]
charts     = ["#2166AC", "#D73027", "#1A9850", "#8073AC", "#E08214", "#01665E",
              "#762A83", "#4DAC26", "#F4A582", "#92C5DE", "#A6D96A", "#FDAE61"]
logo_tints = ["#2166AC", "#3B7DC0", "#6A9FD3", "#A9C8E8", "#D6E5F4"]   # mosaico del logo, de oscuro a claro
logo_edges = ["#5A93CC", "#7DA8D8", "#9DBEE3", "#B9D1EC", "#CFE0F2"]   # bordes de los píxeles decorativos
